[staging]
user          deploy
host          staging.example.com
repo          git@github.com:example/example-craft.git
path          /var/www/example/staging
ref           origin/staging
app           example
php-fpm       php8.4-fpm
forward-agent yes

[production]
user          deploy
host          production.example.com
repo          git@github.com:example/example-craft.git
path          /var/www/example/production
ref           origin/production
app           example
php-fpm       php8.4-fpm
forward-agent yes
