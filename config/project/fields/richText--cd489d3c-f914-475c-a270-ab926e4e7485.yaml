columnSuffix: null
handle: richText
instructions: 'Body copy. Use Font Size for small or emphasized text, not for headings — add a Heading block instead.'
name: 'Rich Text'
searchable: false
settings:
  availableTransforms: ''
  availableVolumes: '*'
  css: ".ck.ck-content .rich-text-size-xlarge {\r\n  font-size: 32px;\r\n  line-height: 1.2;\r\n}\r\n\r\n.ck.ck-content .rich-text-size-large {\r\n  font-size: 24px;\r\n  line-height: 1.2;\r\n}\r\n\r\n.ck.ck-content .rich-text-size-medium {\r\n  font-size: 18px;\r\n  line-height: 1.2;\r\n}\r\n\r\n.ck.ck-content .rich-text-size-small {\r\n  font-size: 12px;\r\n  line-height: 1.2;\r\n}"
  defaultTransform: null
  enableSourceEditingForNonAdmins: false
  fullGraphqlData: false
  headingLevels: false
  js: "return {\r\n  list: {\r\n    properties: {\r\n      styles: false,\r\n    },\r\n  },\r\n  fontSize: {\r\n    options: [\r\n      {\r\n        title: 'Small',\r\n        model: 'small',\r\n        view: { name: 'span', classes: 'rich-text-size-small' },\r\n      },\r\n      'default',\r\n      {\r\n        title: 'Medium',\r\n        model: 'medium',\r\n        view: { name: 'span', classes: 'rich-text-size-medium' },\r\n      },\r\n      {\r\n        title: 'Large',\r\n        model: 'large',\r\n        view: { name: 'span', classes: 'rich-text-size-large' },\r\n      },\r\n      {\r\n        title: 'X-Large',\r\n        model: 'xlarge',\r\n        view: { name: 'span', classes: 'rich-text-size-xlarge' },\r\n      },\r\n    ],\r\n  },\r\n}"
  options: null
  purifierConfig: null
  purifyHtml: true
  showUnpermittedFiles: false
  showUnpermittedVolumes: false
  showWordCount: false
  toolbar:
